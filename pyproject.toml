[project]
name = "marketinsights"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "alembic>=1.18.4",
    "psycopg[binary]>=3.3.4",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "fastapi[standard]>=0.141.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.49",
    "pyjwt[crypto]>=2.13.0",
    "pwdlib[argon2]>=0.3.0",
    "structlog>=26.1.0",
    "prometheus-client>=0.26.0",
    "tenacity>=9.1.4",
    "fastapi-cache2[redis]>=0.2.2",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "types-redis>=4.6.0.20241004",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
explicit_package_bases = true
files = ["src", "tests", "main.py", "alembic"]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
